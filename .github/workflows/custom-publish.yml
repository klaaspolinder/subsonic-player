name: Publish custom image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-image
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'klaaspolinder/subsonic-player' && github.ref == 'refs/heads/custom'
    uses: ./.github/workflows/custom-ci.yml
  publish:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image metadata
        id: meta
        shell: bash
        run: |
          echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "version=custom-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%d-%m-%Y)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ghcr.io/klaaspolinder/subsonic-player:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/klaaspolinder/subsonic-player
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0
          build-args: |
            NODE_VERSION=${{ steps.meta.outputs.node }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_RELEASE_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test native container
        env:
          IMAGE: ghcr.io/klaaspolinder/subsonic-player:sha-${{ github.sha }}-${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name native-smoke -p 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker logs native-smoke; docker rm -f native-smoke' EXIT
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-max-time 90 --connect-timeout 2 --max-time 10 --retry-delay 2 http://127.0.0.1:3000/login > /tmp/login.html
          grep -qi '<html' /tmp/login.html
      - name: Push tested architecture image
        env:
          IMAGE: ghcr.io/klaaspolinder/subsonic-player:sha-${{ github.sha }}-${{ matrix.arch }}
        run: docker push "$IMAGE"
  manifest:
    name: Publish latest after both native images pass
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish combined image tags
        env:
          IMAGE: ghcr.io/klaaspolinder/subsonic-player
          REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" --tag "$IMAGE:sha-$REVISION" "$IMAGE:sha-$REVISION-amd64" "$IMAGE:sha-$REVISION-arm64"
          echo "Published: $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
