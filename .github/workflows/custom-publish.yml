name: Publish custom image
on:
  push:
    branches: [custom]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-image
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'klaaspolinder/subsonic-player' && github.ref == 'refs/heads/custom'
    uses: ./.github/workflows/custom-ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image metadata
        id: meta
        shell: bash
        run: |
          echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "version=custom-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%d-%m-%Y)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/klaaspolinder/subsonic-player:latest
            ghcr.io/klaaspolinder/subsonic-player:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/klaaspolinder/subsonic-player
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0
          build-args: |
            NODE_VERSION=${{ steps.meta.outputs.node }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_RELEASE_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
